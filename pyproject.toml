[project]
authors = [
    { name = "Annika Högner", email = "hoegner@iiasa.ac.at"},
]
requires-python = ">=3.10"
dependencies = [
    "pre-commit>=3.3.1",
    "jupyterlab>=4.0.0",
    "jupytext>=1.15.2",
    "pandas-openscm>=0.9.2",
    "gcages>=0.14.0",
    "openscm-units>=0.6.3",
    "scmdata>=0.19.0",
    "matplotlib>=3.10.9",
    "pymagicc>=2.1.5",
    "openscm-runner>=0.13.0",
    "setuptools>=83.0.0",
    "pyarrow>=25.0.1",
]
name = "local"
version = "0.1.0"
description = "repo to attribute GSAT change to individual species in emissions scenarios"
readme = "README.md"

[tool.uv]
package = false

[tool.uv.sources]
gcages = { path = "/Users/hoegner/GitHub/gcages", editable = true }

[tool.jupytext]
formats = "ipynb,py:percent"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "D",
    "PL",
    "TRY",
    "NPY",
    "RUF",
    "UP",
    "S",
]
unfixable = [ ]
ignore = [
    "D200",
    "D400",
    "UP007",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
